name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run lint
      - run: python3 scripts/reference_case.py --check
      - run: npm test
      # 数据契约：剧本 JSON 与事件卡校验（纯标准库，不用装依赖）
      - run: for f in content/scripts/*.json; do python scripts/validate_script.py "$f"; done
      - run: python scripts/validate_events.py
      - run: python -m unittest scripts/test_validate_events.py
      - run: npm run build
